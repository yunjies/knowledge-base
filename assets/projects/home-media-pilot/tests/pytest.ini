[pytest]
# Declared explicitly so the `config/build` mirror node is not skipped.
#
# pytest's built-in default for norecursedirs contains `build`, which would make
# a directory walk over tests/ skip tests/config/build/ entirely: its assertions
# would never run, and would pass only when the path was named on the command
# line. This suite mirrors the repository layout, so a node is named after what
# it checks rather than after pytest's ignore list. The list below is that same
# default with `build` removed.
norecursedirs = *.egg .* _darcs CVS dist node_modules venv {arch}
